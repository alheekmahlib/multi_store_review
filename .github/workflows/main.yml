name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        flutter-version: ["3.24.5", "stable"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./multi_store_review
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
      - name: Get dependencies
        run: flutter pub get
      - name: Static Analysis
        run: flutter analyze --no-pub
      - name: Run Tests
        run: flutter test --no-pub

  platform_interface_tests:
    strategy:
      matrix:
        flutter-version: ["3.24.5", "stable"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./multi_store_review_platform_interface
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
      - name: Get dependencies
        run: flutter pub get
      - name: Static Analysis
        run: flutter analyze --no-pub
      - name: Run Tests
        run: flutter test --no-pub

  windows_example_build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./multi_store_review/example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Build example (Windows)
        run: flutter build windows --debug

  android_plugin_unit_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./multi_store_review/example/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate plugin symlinks
        working-directory: ./multi_store_review/example
        run: flutter pub get
      - name: Run plugin unit tests
        run: ./gradlew :multi_store_review:testDebugUnitTest
