name: multi_store_review
description: "Flutter plugin for showing the in-app review/rating pop-up across multiple stores - Google Play, Huawei AppGallery, Apple App Store and the Microsoft Store. It makes it easy for users to rate your app."
version: 1.0.0
homepage: https://github.com/alheekmahlib/multi_store_review/tree/master/multi_store_review
repository: https://github.com/alheekmahlib/multi_store_review
issue_tracker: https://github.com/alheekmahlib/multi_store_review/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  multi_store_review_platform_interface: ^1.0.0

dependency_overrides:
  multi_store_review_platform_interface:
    path: ../multi_store_review_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.0.0
  plugin_platform_interface: ^2.0.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: dev.alheekmahlib.multi_store_review
        pluginClass: MultiStoreReviewPlugin
      ios:
        pluginClass: MultiStoreReviewPlugin
      macos:
        pluginClass: MultiStoreReviewPlugin
      windows:
        pluginClass: MultiStoreReviewPluginCApi

screenshots:
  - description: A screenshot of the iOS rating pop-up.
    path: screenshots/ios.png
